<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <h1>Trip Sketch</h1>
            <p class="subtitle">Plan a trip, save every version, and revisit ideas anytime.</p>
        </header>

        <section class="layout">
            <div class="left-column">
                <section class="panel">
                    <h2>Create a Trip</h2>
                    <form id="trip-form" class="trip-form">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" name="destination" required>

                        <label for="number_of_days">Number of Days</label>
                        <input type="number" id="number_of_days" name="number_of_days" min="1" required>

                        <label for="budget">Budget</label>
                        <input type="text" id="budget" name="budget" placeholder="Budget, mid-range, luxury" required>

                        <label for="interests">Interests</label>
                        <input type="text" id="interests" name="interests" placeholder="Food, museums, nature" required>

                        <label for="travel_style">Travel Style</label>
                        <input type="text" id="travel_style" name="travel_style" placeholder="Relaxed, adventurous, cultural" required>

                        <button id="generate-button" type="submit">Generate Trip</button>
                    </form>
                </section>

                <section id="message-box" class="message-box hidden"></section>

                <section id="trip-detail-section" class="panel detail-panel">
                    <div id="trip-detail-content" class="empty-state">
                        <h2>Trip Details</h2>
                        <p>Select a saved trip from the history list or generate a new one.</p>
                    </div>
                </section>
            </div>

            <aside class="right-column">
                <section class="panel history-panel">
                    <div class="section-header">
                        <h2>Saved Trips</h2>
                        <button id="refresh-history-button" type="button" class="secondary-button">Refresh</button>
                    </div>
                    <div id="history-status" class="history-status">Loading trip history...</div>
                    <div id="trip-history" class="trip-history"></div>
                </section>
            </aside>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
